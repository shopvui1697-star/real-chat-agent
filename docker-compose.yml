services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    profiles: ["kafka"]
    image: redpandadata/redpanda:v24.2.2
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  orchestrator:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &app_env
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://chat:chat@postgres:5432/chat_agent
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-redpanda:9092}
      TEMPORAL_HOST: temporal:7233
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ORCHESTRATOR_URL: http://orchestrator:8000
      RLS_ENABLED: "true"
      AUTH_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: .
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *app_env
    ports:
      - "8080:8080"
    depends_on:
      orchestrator:
        condition: service_healthy
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command:
      [
        "celery",
        "-A",
        "orchestrator.celery_app.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
      ]
    environment:
      <<: *app_env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

  beat:
    build: .
    command:
      [
        "celery",
        "-A",
        "orchestrator.celery_app.celery_app",
        "beat",
        "--loglevel=info",
      ]
    environment:
      <<: *app_env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  temporal-worker:
    build: .
    command: ["python", "-m", "temporal.worker"]
    environment:
      <<: *app_env
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
