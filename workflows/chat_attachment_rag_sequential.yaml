name: chat_attachment_rag_sequential
steps:
  - id: rules_eval
    after: []
    capability: rules

  - id: parse_docs
    after: [rules_eval]
    capability: parse_docs
    timeout_sec: 60

  - id: rag_on_parsed
    after: [parse_docs]
    capability: rag_retrieve
    params:
      source: parsed_documents
      top_k: 5

  - id: context_build
    after: [rag_on_parsed]
    capability: context_build

  - id: llm_generate
    after: [context_build]
    capability: llm_generate
    params: { mode: final_answer, stream: true }

  - id: persist_turn
    after: [llm_generate]
    capability: persist_reply
