name: chat_attachment
steps:
  - id: rules_eval
    after: []
    capability: rules

  - id: parse_docs
    after: [rules_eval]
    capability: parse_docs
    timeout_sec: 60

  - id: context_build
    after: [parse_docs]
    capability: context_build

  - id: llm_generate
    after: [context_build]
    capability: llm_generate
    params: { mode: final_answer, stream: true }

  - id: persist_turn
    after: [llm_generate]
    capability: persist_reply
